<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="pissy_4.css">
    <link rel="stylesheet" href="site_form7.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: white;
            margin: 0;
        }
        .form-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            max-width: 540px; /* Reduced by 40% */
            width: 100%;
            background: black;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
        }
        .form-column {
            width: 48%;
            display: flex;
            flex-direction: column;
        }
        label, input, select, textarea {
            margin-bottom: 10px;
            width: 100%;
            font-size: 14px; /* Adjusted font size */
        }
        textarea {
            height: 80px; /* Adjusted height */
        }
        .submit-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        button {
            background-color: blue;
            color: white;
            padding: 8px; /* Adjusted padding */
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 14px; /* Adjusted font size */
        }
        button:hover {
            background-color: darkblue;
        }
        .form-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .form-heading img {
            width: 50px; /* Adjust image size as needed */
            height: 50px;
            margin-right: 10px;
        }
        .form-heading h1 {
            font-size: 24px; /* Adjust heading size as needed */
            margin: 0;
        }
        h2 {
            font-size: 16px; /* Reduced by 20% from original size */
        }
        @media (max-width: 768px) {
            .form-container {
                flex-direction: column;
                align-items: center;
            }
            .form-column {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-heading">
            <img src="your-image-url.jpg" alt="Your Image"> <!-- Replace with your image URL -->
            <h1>Contact Us</h1>
        </div>
        <form id="siteForm" action="/submit-form" method="POST">
            <div class="form-column">
                <h2>Contact Information</h2> <!-- Changed from "Personal Info" -->
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required>
                
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required>
                
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
                
                <label for="city">City:</label>
                <input type="text" id="city" name="city" required>
                
                <label for="state">State:</label>
                <select id="state" name="state" required>
                    <option value="" disabled selected>Select state</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option>
                    <option value="DE">Delaware</option>
                    <option value="FL">Florida</option>
                    <option value="GA">Georgia</option>
                    <option value="HI">Hawaii</option>
                    <option value="ID">Idaho</option>
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="IA">Iowa</option>
                    <option value="KS">Kansas</option>
                    <option value="KY">Kentucky</option>
                    <option value="LA">Louisiana</option>
                    <option value="ME">Maine</option>
                    <option value="MD">Maryland</option>
                    <option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option>
                    <option value="MN">Minnesota</option>
                    <option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option>
                    <option value="MT">Montana</option>
                    <option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option>
                    <option value="NH">New Hampshire</option>
                    <option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option>
                    <option value="NY">New York</option>
                    <option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option>
                    <option value="OH">Ohio</option>
                    <option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option>
                    <option value="PA">Pennsylvania</option>
                    <option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option>
                    <option value="SD">South Dakota</option>
                    <option value="TN">Tennessee</option>
                    <option value="TX">Texas</option>
                    <option value="UT">Utah</option>
                    <option value="VT">Vermont</option>
                    <option value="VA">Virginia</option>
                    <option value="WA">Washington</option>
                    <option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option>
                    <option value="WY">Wyoming</option>
                </select>
            </div>
            <div class="form-column">
                <h2>Additional Information</h2> <!-- Reduced font size by 20% -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required style="width: 100% height= 105%;"> <!-- Ensured same width as other fields -->
                
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
                
                <label>
                    <input type="checkbox" name="newsletter"> Click To Subscribe To Our Newsletter
                </label>
                
                <div class="submit-container">
                    <button type="submit">Submit</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
